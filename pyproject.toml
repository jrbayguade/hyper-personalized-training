[project]
name = "fitdash"
version = "0.1.0"
description = "Local fitness dashboard built on Garmin Connect data"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.2",
    "flask>=3.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
